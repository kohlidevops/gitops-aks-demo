apiVersion: v1
kind: Service
metadata:
  name: gitops-nginx
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gitops-nginx
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-nginx
  template:
    metadata:
      labels:
        app: gitops-nginx
    spec:
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
